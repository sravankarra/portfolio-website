<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=56">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v=3">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="admin-ui">
    <span class="admin-giant" aria-hidden="true">ADMIN</span>
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-login-header">
                <p class="eyebrow">private studio</p>
                <i class="fas fa-key"></i>
                <h2>New password</h2>
                <p>Choose a new password for your admin account</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="admin-login-form">
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> New password</label>
                    <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm_password"><i class="fas fa-lock"></i> Confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="8" placeholder="Re-enter new password" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary admin-login-btn">
                    <i class="fas fa-save"></i> Save new password
                </button>
            </form>
        </div>
    </div>
</body>
</html>
