[build]
  command = "pip install -r backend/requirements.txt && python backend/build_netlify.py"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.13"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/portfolio"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin_login_page"
  to = "/admin-login.html"
  status = 200

[[redirects]]
  from = "/resume"
  to = "/static/resumes/sravan-karra-resume.pdf"
  status = 200
